[project]
name = "stronghold"
dynamic = ["version"]  # the git tag is the version; see [tool.hatch.version]
description = "Inventory and stock tracking for small and medium businesses"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.0",
    "sqlalchemy>=2.0.51",
    "cryptography>=45.0.0",
    "uvicorn>=0.34.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# A tarball/zip download has no .git, and without this the *build itself* fails
# with "Error getting the version from source" -- an unusable install.
fallback-version = "0.0.0+unknown"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["backend"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# S and BLE are what the existing noqa suppressions reference; I and UP keep
# agent-written diffs free of import-order and legacy-syntax churn.
extend-select = ["S", "BLE", "I", "UP"]
# Stock dates are plain calendar dates (PO start_date is a sort key, not an
# instant), so date.today() is intended -- tz-aware datetimes add nothing.
ignore = ["DTZ011"]

[tool.ruff.lint.per-file-ignores]
"backend/test_*.py" = ["S101"]  # assert is the point of a test
